name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: write # create the release tag

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false # install scripts must not get a write-capable git token

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Vercel token is scoped to the steps that need it, not the whole job, so npm install scripts never see it.
      - name: Check Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Add VERCEL_TOKEN as a GitHub Actions repository secret and VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository variables."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@67

      # Build on Vercel, not here: `vercel pull` cannot read Sensitive env vars (SB_URL, SB_ANON_KEY)
      # and would bake "[SENSITIVE]" placeholders into the bundle.
      - name: Set release tag
        run: echo "RELEASE_TAG=v$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --build-env VITE_RELEASE_TAG="$RELEASE_TAG" --build-env VITE_COMMIT_SHA="$GITHUB_SHA"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
